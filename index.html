<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball API</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="modal fade" id="personajeModal" tabindex="-1" aria-labelledby="personajeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="personajeModalLabel">Detalle del personaje</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modalBody">
      </div>
    </div>
  </div>
</div>
<body>
 <header class="mb-3" style="padding-top:0; padding-bottom:0;">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center justify-content-between" style="min-height:70px;">
      <!-- Icono a la izquierda -->
      <a href="index.html">
        <img src="img/icon.png" alt="Icono" class="Icono me-2" style="margin-left: 100px; height:100px;width:100px;">
      </a>
      <!-- Logo centrado -->
      <a href="index.html" class="mx-auto">
        <img src="img/logo.png" alt="Logo" class="Logo d-block mx-auto" style="height:250px;width:auto;">
      </a>
      <!-- Buscador a la derecha -->
      <form id="Buscador" class="d-flex ms-2" role="search" style="margin-right: 100px; min-width: 220px;">
        <input type="search" class="form-control me-2" placeholder="Buscar..." aria-label="Buscar">
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</header>
  <!-- Contenedor principal para las tarjetas -->
  <main>
    <div class="container" id="container">
      <div class="row">
      </div>
    </div>
  </main>

  <div id="loader" style="display:none;text-align:center;">
  <div class="spinner-border text-warning" role="status"></div>
</div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <script src="assets/css/js/script.js"></script>
</body>
</html>
